<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ff9a9e, #fecfef, #fad0c4, #ffecd2);
    background-size: 400% 400%;
    animation: gradient 12s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
    padding: 20px;
  }
  @keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .card {
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    width: 100%;
    max-width: 420px;
    border-radius: 24px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    position: relative;
    z-index: 2;
    animation: popIn 0.8s ease;
  }
  @keyframes popIn {
    0% { transform: scale(0.8) translateY(30px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  .emoji-top { font-size: 64px; animation: bounce 1.5s infinite; }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  h1 {
    font-family: 'Pacifico', cursive;
    font-size: 36px;
    color: #ff4e8a;
    margin: 12px 0;
    line-height: 1.2;
  }
  .name {
    font-size: 28px;
    font-weight: 600;
    color: #333;
    margin-bottom: 12px;
  }
  .message {
    font-size: 16px;
    color: #555;
    line-height: 1.6;
    margin: 16px 0 24px;
  }
  .btn {
    background: linear-gradient(90deg, #ff4e8a, #ff7e5f);
    color: white;
    border: none;
    padding: 14px 28px;
    border-radius: 50px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255,78,138,0.4);
    transition: transform 0.2s;
    width: 100%;
  }
  .btn:active { transform: scale(0.97); }
  #confetti-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  .footer { margin-top: 18px; font-size: 13px; color: #999; }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="card">
  <div class="emoji-top">🎂</div>
  <h1>Happy Birthday!</h1>
  <!-- CHANGE NAME HERE -->
  <div class="name">To My Favorite Person ✨</div>
  
  <!-- CHANGE YOUR MESSAGE HERE -->
  <p class="message">
    Wishing you a day filled with laughter, love, and lots of cake!
    May all your wishes come true. You deserve the world! 🎉💖
  </p>
  
  <button class="btn" onclick="celebrate()">Let's Celebrate 🎊</button>
  <div class="footer">Made with 💝 just for you</div>
</div>

<script>
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
let W, H, confetti = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function randomColor() {
  const colors = ['#ff4e8a','#ffcc00','#00d2ff','#7aff7a','#a78bfa','#ff7e5f'];
  return colors[Math.floor(Math.random()*colors.length)];
}

function createConfetti(count) {
  for(let i=0; i<count; i++) {
    confetti.push({
      x: Math.random()*W,
      y: -20 - Math.random()*H*0.5,
      r: 6 + Math.random()*8,
      color: randomColor(),
      tilt: Math.random()*20-10,
      speedY: 2 + Math.random()*4,
      speedX: -2 + Math.random()*4,
      rot: Math.random()*360
    });
  }
}

function draw() {
  ctx.clearRect(0,0,W,H);
  confetti.forEach((c,i) => {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot * Math.PI/180);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.r/2, -c.r/2, c.r, c.r*0.6);
    ctx.restore();
    c.y += c.speedY;
    c.x += c.speedX;
    c.rot += c.speedX;
    if(c.y > H+30) confetti.splice(i,1);
  });
  requestAnimationFrame(draw);
}

function celebrate() {
  createConfetti(250);
  // small haptic for mobile
  if(navigator.vibrate) navigator.vibrate(100);
  // play again after delay
  setTimeout(()=>createConfetti(150), 400);
}

 // auto confetti on load
createConfetti(200);
draw();

// continuous light confetti
setInterval(()=>{ if(confetti.length < 100) createConfetti(20); }, 1000);
</script>

</body>
</html>
